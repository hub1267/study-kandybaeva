name: Selenium smoke tests
on: [push, pull_request]
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r 'Кандыбаева/Тестирование/requirements.txt'
      - name: Create test database
        run: |
          cd 'Кандыбаева/МДК_04_01/База_данных'
          python create_db.py
          sqlite3 shop.db < demo_data.sql
      - name: Start app and run tests
        run: |
          cd 'Кандыбаева/МДК_04_01/Приложение'
          python server.py &
          cd '../../Тестирование'
          for i in 1 2 3 4 5; do curl -fsS http://127.0.0.1:8000/ && break || sleep 1; done
          python -m unittest discover -s tests -v
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: selenium-screenshots
          path: Кандыбаева/Тестирование/screenshots/
          if-no-files-found: ignore
